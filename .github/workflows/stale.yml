name: Reusable Stale

on:
  workflow_call:
    inputs:
      days-before-stale:
        required: false
        type: number
        default: 60
      days-before-close:
        required: false
        type: number
        default: 14
      exempt-issue-labels:
        required: false
        type: string
        default: pinned,security
      exempt-pr-labels:
        required: false
        type: string
        default: pinned

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          exempt-issue-labels: ${{ inputs.exempt-issue-labels }}
          exempt-pr-labels: ${{ inputs.exempt-pr-labels }}
          stale-issue-message: This issue has had no activity and will be closed soon unless there's a further update.
          stale-pr-message: This pull request has had no activity and will be closed soon unless there's a further update.
