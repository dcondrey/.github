name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20.x"
      run-build:
        description: Whether the repo has a `build` script to run
        required: false
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npx tsc --noEmit
      - if: inputs.run-build
        run: npm run build
      - run: npm test
